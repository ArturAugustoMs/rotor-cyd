; PlatformIO Project Configuration File
; CYD ESP32-2432S028R (2 USB / ST7789) - Rotor Controller
; Display + touch: LovyanGFX | Web: WiFiManager + WebServer

[platformio]
default_envs = cyd
src_dir = src

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
board_build.f_cpu = 240000000L
board_build.embed_files =
  data/font_xs.vlw
  data/font_s.vlw
  data/font_m.vlw
  data/font_l.vlw
  data/font_xl.vlw
  data/font_num.vlw
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  lovyan03/LovyanGFX@1.2.7
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@7.4.2
